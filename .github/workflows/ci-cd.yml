name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
      - staging

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Schema sync check
        run: npm run check:schema-sync

      - name: Resolve validation range
        id: validation_range
        shell: bash
        run: |
          ZERO_SHA="0000000000000000000000000000000000000000"

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "base_sha=${{ github.event.pull_request.base.sha }}" >> "${GITHUB_OUTPUT}"
            echo "head_sha=${{ github.event.pull_request.head.sha }}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ "${{ github.event.before }}" != "${ZERO_SHA}" ]; then
            echo "base_sha=${{ github.event.before }}" >> "${GITHUB_OUTPUT}"
            echo "head_sha=${{ github.sha }}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          ROOT_SHA="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          echo "base_sha=${ROOT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${{ github.sha }}" >> "${GITHUB_OUTPUT}"

      - name: Documentation coverage check
        run: >-
          npm run check:delivery:range --
          ${{ steps.validation_range.outputs.base_sha }}
          ${{ steps.validation_range.outputs.head_sha }}

      - name: Test
        run: npm test

      - name: Build frontend and backend
        run: npm run build:production

  deploy_staging:
    name: Deploy Staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: validate
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_APP_ENV: staging
          VITE_RELEASE_SHA: ${{ github.sha }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_TRACES_SAMPLE_RATE: ${{ secrets.VITE_SENTRY_TRACES_SAMPLE_RATE }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_AUTH_API_BASE: ${{ secrets.VITE_AUTH_API_BASE }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_SCAN_API_URL: ${{ secrets.VITE_SCAN_API_URL }}
          VITE_DEVICE_HEARTBEAT_API_URL: ${{ secrets.VITE_DEVICE_HEARTBEAT_API_URL }}
          VITE_STUDENT_QR_API_URL: ${{ secrets.VITE_STUDENT_QR_API_URL }}
          VITE_QR_PUBLIC_KEY: ${{ secrets.VITE_QR_PUBLIC_KEY }}
          VITE_STUDENT_QR_PUBLIC_KEY: ${{ secrets.VITE_STUDENT_QR_PUBLIC_KEY }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
          VITE_PUBLIC_APP_URL: ${{ secrets.VITE_PUBLIC_APP_URL }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_BASE_PATH: ${{ secrets.VITE_BASE_PATH }}
          VITE_USE_HASH_ROUTER: ${{ secrets.VITE_USE_HASH_ROUTER }}
          VITE_SUPPORT_WHATSAPP: ${{ secrets.VITE_SUPPORT_WHATSAPP }}
          VITE_PRODUCT_DEMO_VIDEO_URL: ${{ secrets.VITE_PRODUCT_DEMO_VIDEO_URL }}
          VITE_PRODUCT_DEMO_EMBED_URL: ${{ secrets.VITE_PRODUCT_DEMO_EMBED_URL }}

      - name: Setup Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy frontend to Vercel
        run: vercel deploy --prebuilt --prod --token "${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Trigger Render staging deploy
        run: curl --fail --show-error --silent --request POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy_production:
    name: Deploy Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_APP_ENV: production
          VITE_RELEASE_SHA: ${{ github.sha }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_TRACES_SAMPLE_RATE: ${{ secrets.VITE_SENTRY_TRACES_SAMPLE_RATE }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_AUTH_API_BASE: ${{ secrets.VITE_AUTH_API_BASE }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_SCAN_API_URL: ${{ secrets.VITE_SCAN_API_URL }}
          VITE_DEVICE_HEARTBEAT_API_URL: ${{ secrets.VITE_DEVICE_HEARTBEAT_API_URL }}
          VITE_STUDENT_QR_API_URL: ${{ secrets.VITE_STUDENT_QR_API_URL }}
          VITE_QR_PUBLIC_KEY: ${{ secrets.VITE_QR_PUBLIC_KEY }}
          VITE_STUDENT_QR_PUBLIC_KEY: ${{ secrets.VITE_STUDENT_QR_PUBLIC_KEY }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
          VITE_PUBLIC_APP_URL: ${{ secrets.VITE_PUBLIC_APP_URL }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_BASE_PATH: ${{ secrets.VITE_BASE_PATH }}
          VITE_USE_HASH_ROUTER: ${{ secrets.VITE_USE_HASH_ROUTER }}
          VITE_SUPPORT_WHATSAPP: ${{ secrets.VITE_SUPPORT_WHATSAPP }}
          VITE_PRODUCT_DEMO_VIDEO_URL: ${{ secrets.VITE_PRODUCT_DEMO_VIDEO_URL }}
          VITE_PRODUCT_DEMO_EMBED_URL: ${{ secrets.VITE_PRODUCT_DEMO_EMBED_URL }}

      - name: Setup Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy frontend to Vercel
        run: vercel deploy --prebuilt --prod --token "${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Trigger Render production deploy
        run: curl --fail --show-error --silent --request POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  notify_failure:
    name: Notify Failure
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        (
          needs.validate.result == 'failure' ||
          needs.deploy_staging.result == 'failure' ||
          needs.deploy_production.result == 'failure'
        )
      }}
    needs:
      - validate
      - deploy_staging
      - deploy_production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Send alert
        run: >-
          node ./scripts/send-webhook-alert.mjs
          --title "Libriofy CI/CD failed"
          --severity "critical"
          --source "github-actions"
          --message "Workflow ${GITHUB_WORKFLOW} failed for ${GITHUB_REF} at commit ${GITHUB_SHA}."
        env:
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}

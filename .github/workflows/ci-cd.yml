name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
      - staging

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Schema sync check
        run: npm run check:schema-sync

      - name: Migration safety check
        run: npm run check:supabase-migration-safety

      - name: Test
        run: npm test

      - name: Build frontend and backend
        run: npm run build:production

  deploy_staging:
    name: Deploy Staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    needs: validate
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inspect Supabase migration status
        run: npm run check:supabase-migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply Supabase migrations
        run: npm run db:push:linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify Supabase migration status
        run: npm run check:supabase-migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Validate linked database schema contract
        run: npm run check:linked-db-health
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}

      - name: Build frontend
        run: npm run build
        env:
          VITE_APP_ENV: staging
          VITE_RELEASE_SHA: ${{ github.sha }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_TRACES_SAMPLE_RATE: ${{ secrets.VITE_SENTRY_TRACES_SAMPLE_RATE }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_SCAN_API_URL: ${{ secrets.VITE_SCAN_API_URL }}
          VITE_DEVICE_HEARTBEAT_API_URL: ${{ secrets.VITE_DEVICE_HEARTBEAT_API_URL }}
          VITE_STUDENT_QR_API_URL: ${{ secrets.VITE_STUDENT_QR_API_URL }}
          VITE_QR_PUBLIC_KEY: ${{ secrets.VITE_QR_PUBLIC_KEY }}
          VITE_STUDENT_QR_PUBLIC_KEY: ${{ secrets.VITE_STUDENT_QR_PUBLIC_KEY }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
          VITE_PUBLIC_APP_URL: ${{ secrets.VITE_PUBLIC_APP_URL }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_BASE_PATH: ${{ secrets.VITE_BASE_PATH }}
          VITE_USE_HASH_ROUTER: ${{ secrets.VITE_USE_HASH_ROUTER }}
          VITE_SUPPORT_WHATSAPP: ${{ secrets.VITE_SUPPORT_WHATSAPP }}
          VITE_PRODUCT_DEMO_VIDEO_URL: ${{ secrets.VITE_PRODUCT_DEMO_VIDEO_URL }}
          VITE_PRODUCT_DEMO_EMBED_URL: ${{ secrets.VITE_PRODUCT_DEMO_EMBED_URL }}

      - name: Setup Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy frontend to Vercel
        run: vercel deploy --prod --token "${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Trigger Render staging deploy
        run: curl --fail --show-error --silent --request POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Wait for staging propagation
        run: sleep 15

      - name: Verify staging health
        run: |
          HEALTH_URL="${{ secrets.VITE_PUBLIC_APP_URL }}/api/health/ready"
          echo "Checking staging health at: $HEALTH_URL"
          for i in 1 2 3; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$HEALTH_URL" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✓ Staging health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "⚠ Staging health check did not pass (non-blocking)"

  deploy_production:
    name: Deploy Production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inspect Supabase migration status
        run: npm run check:supabase-migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply Supabase migrations
        run: npm run db:push:linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify Supabase migration status
        run: npm run check:supabase-migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Validate linked database schema contract
        run: npm run check:linked-db-health
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}

      - name: Build frontend
        run: npm run build
        env:
          VITE_APP_ENV: production
          VITE_RELEASE_SHA: ${{ github.sha }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_SENTRY_TRACES_SAMPLE_RATE: ${{ secrets.VITE_SENTRY_TRACES_SAMPLE_RATE }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_SCAN_API_URL: ${{ secrets.VITE_SCAN_API_URL }}
          VITE_DEVICE_HEARTBEAT_API_URL: ${{ secrets.VITE_DEVICE_HEARTBEAT_API_URL }}
          VITE_STUDENT_QR_API_URL: ${{ secrets.VITE_STUDENT_QR_API_URL }}
          VITE_QR_PUBLIC_KEY: ${{ secrets.VITE_QR_PUBLIC_KEY }}
          VITE_STUDENT_QR_PUBLIC_KEY: ${{ secrets.VITE_STUDENT_QR_PUBLIC_KEY }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
          VITE_PUBLIC_APP_URL: ${{ secrets.VITE_PUBLIC_APP_URL }}
          VITE_APP_URL: ${{ secrets.VITE_APP_URL }}
          VITE_BASE_PATH: ${{ secrets.VITE_BASE_PATH }}
          VITE_USE_HASH_ROUTER: ${{ secrets.VITE_USE_HASH_ROUTER }}
          VITE_SUPPORT_WHATSAPP: ${{ secrets.VITE_SUPPORT_WHATSAPP }}
          VITE_PRODUCT_DEMO_VIDEO_URL: ${{ secrets.VITE_PRODUCT_DEMO_VIDEO_URL }}
          VITE_PRODUCT_DEMO_EMBED_URL: ${{ secrets.VITE_PRODUCT_DEMO_EMBED_URL }}

      - name: Setup Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy frontend to Vercel
        run: vercel deploy --prod --token "${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Trigger Render production deploy
        run: curl --fail --show-error --silent --request POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Wait for deployment propagation
        run: sleep 15

      - name: Verify production health
        run: |
          HEALTH_URL="${{ secrets.VITE_PUBLIC_APP_URL }}/api/health/ready"
          echo "Checking health at: $HEALTH_URL"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$HEALTH_URL" || echo "000")
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✓ Production health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "✗ Production health check FAILED after 5 attempts"
          exit 1

  notify_failure:
    name: Notify Failure
    if: >-
      ${{
        always() &&
        github.event_name == 'push' &&
        (
          needs.validate.result == 'failure' ||
          needs.deploy_staging.result == 'failure' ||
          needs.deploy_production.result == 'failure'
        )
      }}
    needs:
      - validate
      - deploy_staging
      - deploy_production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Send alert
        run: >-
          node ./scripts/send-webhook-alert.mjs
          --title "Libriofy CI/CD failed"
          --severity "critical"
          --source "github-actions"
          --message "Workflow ${GITHUB_WORKFLOW} failed for ${GITHUB_REF} at commit ${GITHUB_SHA}."
        env:
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}

<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <!-- Sidebar -->
  <rect x="0" y="0" width="260" height="1080" fill="#0e161b"/>
  <text x="130" y="50" font-family="system-ui" font-size="24" font-weight="700" fill="white" text-anchor="middle">Libriofy</text>
  <rect x="20" y="90" width="220" height="40" rx="8" fill="#1a7f72" opacity="0.9"/>
  <text x="130" y="116" font-family="system-ui" font-size="14" fill="white" text-anchor="middle">Dashboard</text>
  <!-- Content area -->
  <text x="320" y="70" font-family="system-ui" font-size="28" font-weight="600" fill="#1e293b">Library Dashboard</text>
  <!-- Stats cards -->
  <rect x="300" y="100" width="360" height="140" rx="16" fill="white" stroke="#e2e8f0"/>
  <text x="340" y="140" font-family="system-ui" font-size="14" fill="#64748b">Active Students</text>
  <text x="340" y="190" font-family="system-ui" font-size="42" font-weight="700" fill="#0e161b">247</text>
  <text x="340" y="220" font-family="system-ui" font-size="12" fill="#1a7f72">↑ 12% this month</text>
  <rect x="690" y="100" width="360" height="140" rx="16" fill="white" stroke="#e2e8f0"/>
  <text x="730" y="140" font-family="system-ui" font-size="14" fill="#64748b">Monthly Revenue</text>
  <text x="730" y="190" font-family="system-ui" font-size="42" font-weight="700" fill="#0e161b">₹2.4L</text>
  <text x="730" y="220" font-family="system-ui" font-size="12" fill="#1a7f72">↑ 8% vs last month</text>
  <rect x="1080" y="100" width="360" height="140" rx="16" fill="white" stroke="#e2e8f0"/>
  <text x="1120" y="140" font-family="system-ui" font-size="14" fill="#64748b">Seat Occupancy</text>
  <text x="1120" y="190" font-family="system-ui" font-size="42" font-weight="700" fill="#0e161b">84%</text>
  <text x="1120" y="220" font-family="system-ui" font-size="12" fill="#1a7f72">32 of 38 seats occupied</text>
  <rect x="1470" y="100" width="360" height="140" rx="16" fill="white" stroke="#e2e8f0"/>
  <text x="1510" y="140" font-family="system-ui" font-size="14" fill="#64748b">Attendance Today</text>
  <text x="1510" y="190" font-family="system-ui" font-size="42" font-weight="700" fill="#0e161b">156</text>
  <text x="1510" y="220" font-family="system-ui" font-size="12" fill="#1a7f72">Check-ins recorded</text>
  <!-- Chart area -->
  <rect x="300" y="270" width="820" height="380" rx="16" fill="white" stroke="#e2e8f0"/>
  <text x="340" y="310" font-family="system-ui" font-size="18" font-weight="600" fill="#1e293b">Revenue Overview</text>
  <!-- Chart bars -->
  <rect x="370" y="500" width="40" height="120" rx="4" fill="#1a7f72" opacity="0.7"/>
  <rect x="440" y="460" width="40" height="160" rx="4" fill="#1a7f72" opacity="0.8"/>
  <rect x="510" y="420" width="40" height="200" rx="4" fill="#1a7f72" opacity="0.85"/>
  <rect x="580" y="380" width="40" height="240" rx="4" fill="#1a7f72"/>
  <rect x="650" y="400" width="40" height="220" rx="4" fill="#1a7f72" opacity="0.9"/>
  <rect x="720" y="360" width="40" height="260" rx="4" fill="#1a7f72"/>
  <rect x="790" y="340" width="40" height="280" rx="4" fill="#1a7f72"/>
</svg>

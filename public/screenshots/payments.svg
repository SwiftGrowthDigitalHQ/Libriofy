<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect x="0" y="0" width="260" height="1080" fill="#0e161b"/>
  <text x="130" y="50" font-family="system-ui" font-size="24" font-weight="700" fill="white" text-anchor="middle">Libriofy</text>
  <rect x="20" y="255" width="220" height="40" rx="8" fill="#1a7f72" opacity="0.9"/>
  <text x="130" y="281" font-family="system-ui" font-size="14" fill="white" text-anchor="middle">Payments</text>
  <!-- Content -->
  <text x="320" y="70" font-family="system-ui" font-size="28" font-weight="600" fill="#1e293b">Payment Management</text>
  <!-- Stats -->
  <rect x="300" y="100" width="500" height="120" rx="16" fill="white" stroke="#e2e8f0"/>
  <text x="340" y="135" font-family="system-ui" font-size="14" fill="#64748b">This Month</text>
  <text x="340" y="175" font-family="system-ui" font-size="36" font-weight="700" fill="#0e161b">₹2,45,600</text>
  <text x="340" y="200" font-family="system-ui" font-size="12" fill="#1a7f72">↑ 18% vs last month</text>
  <rect x="830" y="100" width="500" height="120" rx="16" fill="white" stroke="#e2e8f0"/>
  <text x="870" y="135" font-family="system-ui" font-size="14" fill="#64748b">Pending</text>
  <text x="870" y="175" font-family="system-ui" font-size="36" font-weight="700" fill="#f59e0b">₹34,200</text>
  <text x="870" y="200" font-family="system-ui" font-size="12" fill="#64748b">12 payments overdue</text>
  <!-- Payment table -->
  <rect x="300" y="250" width="1530" height="500" rx="16" fill="white" stroke="#e2e8f0"/>
  <text x="340" y="290" font-family="system-ui" font-size="18" font-weight="600" fill="#1e293b">Recent Transactions</text>
  <!-- Headers -->
  <text x="340" y="335" font-family="system-ui" font-size="12" font-weight="600" fill="#64748b">STUDENT</text>
  <text x="620" y="335" font-family="system-ui" font-size="12" font-weight="600" fill="#64748b">AMOUNT</text>
  <text x="820" y="335" font-family="system-ui" font-size="12" font-weight="600" fill="#64748b">DATE</text>
  <text x="1020" y="335" font-family="system-ui" font-size="12" font-weight="600" fill="#64748b">PLAN</text>
  <text x="1280" y="335" font-family="system-ui" font-size="12" font-weight="600" fill="#64748b">METHOD</text>
  <text x="1520" y="335" font-family="system-ui" font-size="12" font-weight="600" fill="#64748b">STATUS</text>
  <!-- Rows -->
  <rect x="320" y="350" width="1490" height="50" rx="6" fill="#f8fafc"/>
  <text x="340" y="380" font-family="system-ui" font-size="14" fill="#1e293b">Rahul Sharma</text>
  <text x="620" y="380" font-family="system-ui" font-size="14" font-weight="600" fill="#1e293b">₹4,500</text>
  <text x="820" y="380" font-family="system-ui" font-size="14" fill="#64748b">25 Jun 2026</text>
  <text x="1020" y="380" font-family="system-ui" font-size="14" fill="#64748b">Premium Monthly</text>
  <text x="1280" y="380" font-family="system-ui" font-size="14" fill="#64748b">UPI</text>
  <rect x="1520" y="365" width="60" height="24" rx="12" fill="#dcfce7"/>
  <text x="1550" y="382" font-family="system-ui" font-size="11" fill="#166534" text-anchor="middle">Paid</text>
</svg>

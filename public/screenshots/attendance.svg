<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <!-- Sidebar -->
  <rect x="0" y="0" width="260" height="1080" fill="#0e161b"/>
  <text x="130" y="50" font-family="system-ui" font-size="24" font-weight="700" fill="white" text-anchor="middle">Libriofy</text>
  <rect x="20" y="200" width="220" height="40" rx="8" fill="#1a7f72" opacity="0.9"/>
  <text x="130" y="226" font-family="system-ui" font-size="14" fill="white" text-anchor="middle">Attendance</text>
  <!-- Content -->
  <text x="320" y="70" font-family="system-ui" font-size="28" font-weight="600" fill="#1e293b">Attendance Tracking</text>
  <!-- QR Scanner card -->
  <rect x="300" y="100" width="500" height="500" rx="16" fill="white" stroke="#e2e8f0"/>
  <text x="550" y="140" font-family="system-ui" font-size="18" font-weight="600" fill="#1e293b" text-anchor="middle">QR Scanner Active</text>
  <rect x="400" y="170" width="300" height="300" rx="12" fill="#f1f5f9" stroke="#1a7f72" stroke-width="3"/>
  <text x="550" y="330" font-family="system-ui" font-size="48" fill="#1a7f72" text-anchor="middle">⬡</text>
  <text x="550" y="510" font-family="system-ui" font-size="14" fill="#64748b" text-anchor="middle">Point camera at student QR code</text>
  <rect x="400" y="540" width="300" height="44" rx="8" fill="#1a7f72"/>
  <text x="550" y="568" font-family="system-ui" font-size="14" fill="white" text-anchor="middle">Manual Entry</text>
  <!-- Today's log -->
  <rect x="830" y="100" width="740" height="500" rx="16" fill="white" stroke="#e2e8f0"/>
  <text x="870" y="140" font-family="system-ui" font-size="18" font-weight="600" fill="#1e293b">Today's Log</text>
  <!-- Table header -->
  <text x="870" y="185" font-family="system-ui" font-size="12" font-weight="600" fill="#64748b">STUDENT</text>
  <text x="1100" y="185" font-family="system-ui" font-size="12" font-weight="600" fill="#64748b">CHECK-IN</text>
  <text x="1280" y="185" font-family="system-ui" font-size="12" font-weight="600" fill="#64748b">CHECK-OUT</text>
  <text x="1440" y="185" font-family="system-ui" font-size="12" font-weight="600" fill="#64748b">STATUS</text>
  <!-- Table rows -->
  <rect x="850" y="200" width="700" height="50" rx="6" fill="#f8fafc"/>
  <text x="870" y="230" font-family="system-ui" font-size="14" fill="#1e293b">Rahul Sharma</text>
  <text x="1100" y="230" font-family="system-ui" font-size="14" fill="#64748b">08:45 AM</text>
  <text x="1280" y="230" font-family="system-ui" font-size="14" fill="#64748b">—</text>
  <rect x="1440" y="215" width="70" height="24" rx="12" fill="#dcfce7"/>
  <text x="1475" y="232" font-family="system-ui" font-size="11" fill="#166534" text-anchor="middle">Present</text>
  <rect x="850" y="260" width="700" height="50" rx="6" fill="white"/>
  <text x="870" y="290" font-family="system-ui" font-size="14" fill="#1e293b">Priya Patel</text>
  <text x="1100" y="290" font-family="system-ui" font-size="14" fill="#64748b">09:12 AM</text>
  <text x="1280" y="290" font-family="system-ui" font-size="14" fill="#64748b">01:30 PM</text>
  <rect x="1440" y="275" width="70" height="24" rx="12" fill="#fef3c7"/>
  <text x="1475" y="292" font-family="system-ui" font-size="11" fill="#92400e" text-anchor="middle">Left</text>
</svg>
